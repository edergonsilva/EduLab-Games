services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - PYTHONPATH=/app
      - EDULAB_SESSION_SECRET=${EDULAB_SESSION_SECRET}
      - EDULAB_COOKIE_SECURE=${EDULAB_COOKIE_SECURE:-false}
      - EDULAB_ALLOWED_ORIGINS=${EDULAB_ALLOWED_ORIGINS}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
