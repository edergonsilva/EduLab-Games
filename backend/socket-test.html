<!DOCTYPE html>
<html>
<head>
  <title>Socket.IO Test - Backend</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
  <h1>Socket.IO Connection Test (Direct Backend)</h1>
  <div id="status" style="font-size: 20px; margin: 20px 0;">Status: Connecting...</div>
  <div id="log" style="border: 1px solid #ccc; padding: 10px; height: 300px; overflow: auto; font-family: monospace; font-size: 12px; background: #f5f5f5;"></div>
  
  <script>
    function log(msg) {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `<div>[${time}] ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(msg);
    }
    
    function updateStatus(msg, color = 'black') {
      document.getElementById('status').innerHTML = `<span style="color: ${color}; font-weight: bold;">${msg}</span>`;
    }
    
    log('Creating Socket.IO client connecting to ' + window.location.origin);
    log('Backend URL: ' + window.location.origin);
    
    // Connect to same origin (backend serving this file)
    const socket = io(window.location.origin, {
      path: '/socket.io/',
      withCredentials: true,
      transports: ['polling', 'websocket'],
      reconnection: true,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
      reconnectionAttempts: 10,
      pollInterval: 300,
    });
    
    socket.on('connect', () => {
      log('✅ CONNECTED! SID: ' + socket.id);
      updateStatus('✅ Connected: ' + socket.id, 'green');
    });
    
    socket.on('disconnect', (reason) => {
      log('❌ Disconnected: ' + reason);
      updateStatus('❌ Disconnected: ' + reason, 'red');
    });
    
    socket.on('connect_error', (error) => {
      log('⚠️ Connect error: ' + (error?.message || error?.description || error));
      updateStatus('⚠️ Error: ' + (error?.message || error), 'orange');
    });
    
    socket.on('error', (error) => {
      log('🔴 Error event: ' + JSON.stringify(error));
    });
    
    socket.onAny((event, ...args) => {
      log(`📨 Event: ${event} → ${JSON.stringify(args[0]).substring(0, 100)}`);
    });
    
    log('Socket.IO client created, waiting...');
  </script>
</body>
</html>
